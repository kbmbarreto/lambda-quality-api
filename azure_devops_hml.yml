  # ============================================================
  # 5. TESTES ANTES DO DEPLOY
  # ============================================================

  - stage: Integration_Tests

    displayName: "5. Unit & Integration Tests"

    dependsOn:
      - Secrets_Check
      - SAST_Check
      - SCA_Check
      - IaC_Check

    # Segurança permanece consultiva; testes e build são bloqueantes.
    condition: succeededOrFailed()

    jobs:

      - job: ValidateAndPackage

        displayName: "Node.js 24 - validação e imagens de release"
        condition: not(canceled())
        timeoutInMinutes: 90

        steps:

          - checkout: self
            clean: true
            fetchDepth: 1

          - task: NodeTool@0
            displayName: "Preparar Node.js 24"
            inputs:
              versionSpec: "$(NODE_VERSION)"
              checkLatest: false

          - bash: |
              set -euo pipefail
              docker info >/dev/null
              npm ci
              npm run build
              npm run lint
              npm run typecheck
            displayName: "Instalar dependências, build, lint e tipos"
            env:
              NODE_ENV: development
              DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci
              DATABASE_DIALECT: mysql
              DB_USERNAME: ''
              DB_PASSWORD: ''

          - bash: |
              set -euo pipefail
              mkdir -p "$(TEST_RESULTS_DIRECTORY)"
              npx vitest run --project unit \
                --reporter default --reporter junit \
                --outputFile.junit="$(TEST_RESULTS_DIRECTORY)/unit.xml"
            displayName: "Testes unitários e contratos HTTP"
            env:
              NODE_ENV: test

          - bash: |
              set -euo pipefail
              mkdir -p "$(TEST_RESULTS_DIRECTORY)"
              npx vitest run --project integration \
                --reporter default --reporter junit \
                --outputFile.junit="$(TEST_RESULTS_DIRECTORY)/integration-mysql.xml"
            displayName: "Integração - MySQL 8.4 descartável"
            env:
              NODE_ENV: test
              TEST_DATABASE_DIALECT: mysql
              TEST_DATABASE_SERVER_URL: ''
              TEST_MYSQL_SERVER_URL: ''
              TEST_USE_CONFIGURED_DATABASE: 'false'
              TEST_USE_CONFIGURED_MYSQL: 'false'

          - bash: |
              set -euo pipefail
              mkdir -p "$(TEST_RESULTS_DIRECTORY)"
              npx vitest run --project integration \
                --reporter default --reporter junit \
                --outputFile.junit="$(TEST_RESULTS_DIRECTORY)/integration-mariadb.xml"
            displayName: "Integração - MariaDB 10.11 descartável"
            env:
              NODE_ENV: test
              TEST_DATABASE_DIALECT: mariadb
              TEST_DATABASE_SERVER_URL: ''
              TEST_MYSQL_SERVER_URL: ''
              TEST_USE_CONFIGURED_DATABASE: 'false'
              TEST_USE_CONFIGURED_MYSQL: 'false'

          - bash: |
              set -euo pipefail
              python3 scripts/cicd/test-deploy.py
            displayName: "Verificar migrations, saúde, rollback e integridade da release"

          - task: PublishTestResults@2
            displayName: "Publicar resultados dos testes"
            condition: always()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: "$(TEST_RESULTS_DIRECTORY)/*.xml"
              mergeTestResults: false
              failTaskOnFailedTests: true
              failTaskOnMissingResultsFile: true
              testRunTitle: "LambdaQuality - unitários e integração"

          - bash: |
              set -euo pipefail
              docker build --platform "$DOCKER_PLATFORM" --target runtime \
                --label "org.opencontainers.image.revision=$(Build.SourceVersion)" \
                --tag "$API_IMAGE" .
              docker build --platform "$DOCKER_PLATFORM" --target migrations \
                --label "org.opencontainers.image.revision=$(Build.SourceVersion)" \
                --tag "$MIGRATIONS_IMAGE" .
              docker run --rm --entrypoint node "$API_IMAGE" \
                --input-type=module -e 'await import("./dist/app.js");'
              docker run --rm --entrypoint node \
                -e DATABASE_URL=mysql://ci:ci@127.0.0.1:3306/ci \
                "$MIGRATIONS_IMAGE" node_modules/prisma/build/index.js --version
              node scripts/cicd/test-migrations-image.mjs "$MIGRATIONS_IMAGE"
              mkdir -p "$RELEASE_DIRECTORY/scripts/cicd"
              cp docker-compose.hml.yml "$RELEASE_DIRECTORY/"
              cp scripts/cicd/{release.py,prepare-config.py,deploy-common.sh,deploy-hml.sh,rollback-hml.sh} \
                "$RELEASE_DIRECTORY/scripts/cicd/"
              docker image save "$API_IMAGE" "$MIGRATIONS_IMAGE" \
                | gzip -1 > "$RELEASE_DIRECTORY/images.tar.gz"
              API_ID=$(docker image inspect --format '{{.Id}}' "$API_IMAGE")
              MIGRATIONS_ID=$(docker image inspect --format '{{.Id}}' "$MIGRATIONS_IMAGE")
              python3 scripts/cicd/release.py create "$RELEASE_DIRECTORY" \
                "$RELEASE_ID" "$API_ID" "$MIGRATIONS_ID"
              python3 scripts/cicd/release.py verify "$RELEASE_DIRECTORY" "$RELEASE_ID"
            displayName: "Construir, verificar e empacotar imagens Docker"
            env:
              DOCKER_PLATFORM: ${{ parameters.dockerPlatform }}
              RELEASE_ID: "$(RELEASE_ID)"
              API_IMAGE: "$(API_IMAGE)"
              MIGRATIONS_IMAGE: "$(MIGRATIONS_IMAGE)"
              RELEASE_DIRECTORY: "$(RELEASE_DIRECTORY)"

          - task: PublishPipelineArtifact@1
            displayName: "Publicar release validada (sem configurações ou chaves)"
            inputs:
              targetPath: "$(RELEASE_DIRECTORY)"
              artifact: backend-release
              publishLocation: pipeline

          - bash: |
              docker image rm "$API_IMAGE" "$MIGRATIONS_IMAGE" >/dev/null 2>&1 || true
            displayName: "Remover somente imagens temporárias deste run no agente de CI"
            condition: always()
            env:
              API_IMAGE: "$(API_IMAGE)"
              MIGRATIONS_IMAGE: "$(MIGRATIONS_IMAGE)"

  # ============================================================
  # 6. DEPLOY BACKEND - HOMOLOGAÇÃO
  # ============================================================

  - stage: Deploy_Backend_Hml

    displayName: "6. Deploy Backend - Homologação"
    dependsOn:
      - Secrets_Check
      - SAST_Check
      - SCA_Check
      - IaC_Check
      - Integration_Tests

    # Findings não impedem a aprovação manual; testes/build devem ter passado.
    condition: >-
      and(not(canceled()),
          eq(dependencies.Integration_Tests.result, 'Succeeded'),
          ne(variables['Build.Reason'], 'PullRequest'))
    lockBehavior: sequential

    jobs:

      - job: WaitForDeployHmlApproval
        displayName: "Aguardar autorização - Homologação"
        pool: server
        condition: not(canceled())
        timeoutInMinutes: 1441
        steps:
          - task: ManualValidation@0
            displayName: "Autorizar Deploy Backend - Homologação"
            timeoutInMinutes: 1440
            inputs:
              notifyUsers: ''
              instructions: |
                Os testes unitários, integrações, build, lint e tipos passaram.
                Avalie os relatórios de Secrets, SAST, SCA e IaC antes de aprovar.
                Checks de segurança permanecem consultivos, conforme o padrão atual.
                O destino é a VM ${{ parameters.hmlVmResource }} do Environment
                ${{ parameters.hmlEnvironment }}, não uma máquina do pool de CI configurado.
                Confirme backup do banco e compatibilidade das migrations com a
                versão anterior, caso seja necessário rollback da aplicação.
                RESUME autoriza migrations versionadas e publicação da API.
                REJECT cancela o deploy. O rollback é manual e não reverte dados/DDL.
              onTimeout: reject

      - deployment: DeployBackendHml
        displayName: "Publicar na VM de homologação"
        variables:
          - group: LambdaQuality-HML
        dependsOn: WaitForDeployHmlApproval
        condition: >-
          and(not(canceled()),
              eq(dependencies.WaitForDeployHmlApproval.result, 'Succeeded'))
        timeoutInMinutes: 30
        environment:
          name: ${{ parameters.hmlEnvironment }}
          resourceName: ${{ parameters.hmlVmResource }}
          resourceType: virtualMachine
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: none
                - download: none
                - download: current
                  artifact: backend-release
                  displayName: "Obter imagens e scripts deste run na VM de destino"
                - bash: |
                    set -euo pipefail
                    bash "$ARTIFACT_DIRECTORY/scripts/cicd/deploy-hml.sh" \
                      "$DEPLOY_ROOT" "$ARTIFACT_DIRECTORY" "$RELEASE_ID"
                  displayName: "Preflight > migrations > nova API > readiness"
                  env:
                    DEPLOY_ROOT: ${{ parameters.hmlDeployRoot }}
                    ARTIFACT_DIRECTORY: "$(Pipeline.Workspace)/backend-release"
                    RELEASE_ID: "$(RELEASE_ID)"
                    LAMBDAQUALITY_CONFIG_SOURCE: library
                    LQ_ENV_TEST_VAULT_ACTIVE_KEY_ID: "$(TEST_VAULT_ACTIVE_KEY_ID)"
                    LQ_ENV_TEST_VAULT_ENCRYPTION_KEYS: "$(TEST_VAULT_ENCRYPTION_KEYS)"
                    LQ_ENV_DATABASE_DIALECT: "$(DATABASE_DIALECT)"
                    LQ_ENV_DATABASE_URL: "$(DATABASE_URL)"
                    LQ_ENV_DB_URL: "$(DB_URL)"
                    LQ_ENV_DB_USERNAME: "$(DB_USERNAME)"
                    LQ_ENV_DB_PASSWORD: "$(DB_PASSWORD)"
                    LQ_ENV_DB_SSL_CA_PATH: "$(DB_SSL_CA_PATH)"
                    LQ_ENV_JWT_SECRET: "$(JWT_SECRET)"
                    LQ_ENV_OTP_HMAC_SECRET: "$(OTP_HMAC_SECRET)"
                    LQ_ENV_INVITATION_ENCRYPTION_SECRET: "$(INVITATION_ENCRYPTION_SECRET)"
                    LQ_ENV_JWT_KEY_ID: "$(JWT_KEY_ID)"
                    LQ_ENV_JWT_ISSUER: "$(JWT_ISSUER)"
                    LQ_ENV_JWT_AUDIENCE: "$(JWT_AUDIENCE)"
                    LQ_ENV_ACCESS_TOKEN_TTL_SECONDS: "$(ACCESS_TOKEN_TTL_SECONDS)"
                    LQ_ENV_SESSION_TTL_SECONDS: "$(SESSION_TTL_SECONDS)"
                    LQ_ENV_REFRESH_IDLE_TTL_SECONDS: "$(REFRESH_IDLE_TTL_SECONDS)"
                    LQ_ENV_EMAIL_CODE_TTL_SECONDS: "$(EMAIL_CODE_TTL_SECONDS)"
                    LQ_ENV_EMAIL_CODE_MAX_ATTEMPTS: "$(EMAIL_CODE_MAX_ATTEMPTS)"
                    LQ_ENV_EMAIL_CODE_COOLDOWN_SECONDS: "$(EMAIL_CODE_COOLDOWN_SECONDS)"
                    LQ_ENV_AUTH_RATE_LIMIT: "$(AUTH_RATE_LIMIT)"
                    LQ_ENV_AUTH_RATE_WINDOW_SECONDS: "$(AUTH_RATE_WINDOW_SECONDS)"
                    LQ_ENV_SENDGRID_API_KEY: "$(SENDGRID_API_KEY)"
                    LQ_ENV_SENDGRID_FROM_EMAIL: "$(SENDGRID_FROM_EMAIL)"
                    LQ_ENV_SENDGRID_FROM_NAME: "$(SENDGRID_FROM_NAME)"
                    LQ_ENV_MAIL_USERNAME: "$(MAIL_USERNAME)"
                    LQ_ENV_CORS_ORIGINS: "$(CORS_ORIGINS)"
                    LQ_ENV_WORKSPACE_RATE_LIMIT: "$(WORKSPACE_RATE_LIMIT)"
                    LQ_ENV_INVITATION_TTL_SECONDS: "$(INVITATION_TTL_SECONDS)"
                    LQ_ENV_INVITATION_COOLDOWN_SECONDS: "$(INVITATION_COOLDOWN_SECONDS)"
                    LQ_ENV_INVITATION_ACCEPT_URL: "$(INVITATION_ACCEPT_URL)"
                    LQ_ENV_LAMBDAQUALITY_STORAGE_ORACLE_REGION: "$(LAMBDAQUALITY_STORAGE_ORACLE_REGION)"
                    LQ_ENV_LAMBDAQUALITY_STORAGE_ORACLE_NAMESPACE: "$(LAMBDAQUALITY_STORAGE_ORACLE_NAMESPACE)"
                    LQ_ENV_LAMBDAQUALITY_STORAGE_ORACLE_BUCKET: "$(LAMBDAQUALITY_STORAGE_ORACLE_BUCKET)"
                    LQ_ENV_LAMBDAQUALITY_STORAGE_PREFIX: "$(LAMBDAQUALITY_STORAGE_PREFIX)"
                    LQ_ENV_LAMBDAQUALITY_STORAGE_ORACLE_TENANCY_OCID: "$(LAMBDAQUALITY_STORAGE_ORACLE_TENANCY_OCID)"
                    LQ_ENV_LAMBDAQUALITY_STORAGE_ORACLE_USER_OCID: "$(LAMBDAQUALITY_STORAGE_ORACLE_USER_OCID)"
                    LQ_ENV_LAMBDAQUALITY_STORAGE_ORACLE_FINGERPRINT: "$(LAMBDAQUALITY_STORAGE_ORACLE_FINGERPRINT)"
                    LQ_ENV_LAMBDAQUALITY_STORAGE_ORACLE_PRIVATE_KEY_PASSPHRASE: "$(LAMBDAQUALITY_STORAGE_ORACLE_PRIVATE_KEY_PASSPHRASE)"
                    LQ_ENV_ATTACHMENT_MAX_BYTES: "$(ATTACHMENT_MAX_BYTES)"
                    LQ_ENV_ATTACHMENT_RETENTION_DAYS: "$(ATTACHMENT_RETENTION_DAYS)"
                    LQ_ENV_LAMBDAQUALITY_HTTP_PORT: "$(LAMBDAQUALITY_HTTP_PORT)"
                    LQ_ENV_LAMBDAQUALITY_BIND_ADDRESS: "$(LAMBDAQUALITY_BIND_ADDRESS)"
                    LQ_ENV_LAMBDAQUALITY_DOCKER_NETWORK: "$(LAMBDAQUALITY_DOCKER_NETWORK)"

  # ============================================================
  # 7. ROLLBACK MANUAL/OPCIONAL
  # ============================================================

  - stage: Rollback_Backend_Hml

    displayName: "7. Rollback Backend - Homologação"
    trigger: manual
    condition: not(canceled())
    lockBehavior: sequential

    jobs:
      - deployment: RollbackBackendHml
        displayName: "Retomar aplicação anterior na mesma VM"
        condition: not(canceled())
        timeoutInMinutes: 15
        environment:
          name: ${{ parameters.hmlEnvironment }}
          resourceName: ${{ parameters.hmlVmResource }}
          resourceType: virtualMachine
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: none
                - download: none
                - download: current
                  artifact: backend-release
                - bash: |
                    set -euo pipefail
                    bash "$ARTIFACT_DIRECTORY/scripts/cicd/rollback-hml.sh" \
                      "$DEPLOY_ROOT" "$RELEASE_ID"
                  displayName: "Restaurar imagem anterior e validar saúde (sem reverter banco)"
                  env:
                    DEPLOY_ROOT: ${{ parameters.hmlDeployRoot }}
                    ARTIFACT_DIRECTORY: "$(Pipeline.Workspace)/backend-release"
                    RELEASE_ID: "$(RELEASE_ID)"
