  # ============================================================
  # 5. DEPLOY BACKEND - PRODUÇÃO
  # ============================================================

  - stage: Deploy_Backend_Prod

    displayName: "5. Deploy Backend - Produção"

    dependsOn: IaC_Check

    # Assim como em HML, o responsável pode avaliar os findings
    # no gate manual. Cancelamento da pipeline interrompe o fluxo.
    condition: succeededOrFailed()

    jobs:


      # ========================================================
      # APROVAÇÃO MANUAL - PRODUÇÃO
      # ========================================================

      - job: WaitForDeployProdApproval

        displayName: "Aguardar autorização - PRODUÇÃO"

        pool: server

        timeoutInMinutes: 43200

        steps:

          - task: ManualValidation@0

            displayName: "Autorizar Deploy Backend - PRODUÇÃO"

            timeoutInMinutes: 43199

            inputs:

              notifyUsers: ''

              instructions: |

                ==================================================
                    AUTORIZAÇÃO DE DEPLOY - PRODUÇÃO
                ==================================================

                Os checks de segurança desta pipeline foram concluídos.

                Antes de autorizar o deploy, verifique os relatórios:
                  1. Secrets-Check
                  2. SAST-Check
                  3. SCA-Check
                  4. IaC-Check

                A aprovação pode ser solicitada mesmo com findings.
                Cabe ao responsável avaliar os resultados antes de continuar.

                Para autorizar o deploy em PRODUÇÃO:
                  RESUME

                Para cancelar o deploy:
                  REJECT

                Após o deploy, os testes de integração Supertest
                serão executados automaticamente neste ambiente.

                ==================================================

              onTimeout: reject


      # ========================================================
      # DEPLOY PRODUÇÃO
      # ========================================================

      - job: DeployBackendProd

        displayName: "Deploy Backend - Produção"

        dependsOn: WaitForDeployProdApproval

        # ------------------------------------------------------
        # Verificamos explicitamente que a aprovação manual
        # terminou com sucesso.
        # ------------------------------------------------------

        condition: |
          in(
            dependencies.WaitForDeployProdApproval.result,
            'Succeeded',
            'SucceededWithIssues'
          )

        steps:

          - checkout: none


          - bash: |
              set -euo pipefail
              
              echo "##vso[task.setvariable variable=deployAttempted;isOutput=true]true"
              echo "Tentativa de deploy em produção registrada para eventual rollback."

            name: MarkDeployProdAttempt

            displayName: "Registrar tentativa de deploy produção"


          - bash: |
              set -euo pipefail
              
              echo "=================================================="
              echo "            DEPLOY BACKEND - PRODUÇÃO"
              echo "=================================================="
              echo
              echo "Ambiente:"
              echo "  PRODUÇÃO"
              echo
              echo "Autorização manual:"
              echo "  APROVADA"
              echo
              echo "Status:"
              echo "  SIMULAÇÃO"
              echo
              echo "Este é apenas o placeholder do deploy."
              echo
              echo "O processo real de implantação em produção"
              echo "será implementado posteriormente pela equipe."
              echo
              echo "Nenhuma aplicação está sendo alterada"
              echo "neste momento."
              echo
              echo "Resultado:"
              echo "  OK"
              echo
              echo "=================================================="
              
              true

            displayName: "Executar deploy em produção"

  # ============================================================
  # ============================================================
  # 6. INTEGRATION TESTS
  # ============================================================

  - stage: Integration_Tests

    displayName: "6. Integration Tests - Supertest"

    dependsOn: Deploy_Backend_Prod

    # ----------------------------------------------------------
    # CORREÇÃO IMPORTANTE
    #
    # Não usamos:
    #
    #   condition: succeeded()
    #
    # porque isso pode considerar failures existentes nos
    # stages de segurança anteriores.
    #
    # Aqui interessa SOMENTE saber se o stage de deploy PRD
    # terminou corretamente.
    # ----------------------------------------------------------

    condition: |
      in(
        dependencies.Deploy_Backend_Prod.result,
        'Succeeded',
        'SucceededWithIssues'
      )

    jobs:

      - job: SupertestBackend

        displayName: "Supertest - Regressão Backend PRD"

        timeoutInMinutes: 40

        steps:


          # ----------------------------------------------------
          # CHECKOUT DOS TESTES
          # ----------------------------------------------------

          - checkout: backend_tests

            displayName: "Checkout dos testes de backend"

            clean: true

            fetchDepth: 1

            path: s/portal_cliente_supertest_backend


          # ----------------------------------------------------
          # INFORMAÇÕES
          # ----------------------------------------------------

          - bash: |
              set -euo pipefail
              
              TEST_DIRECTORY="$(Pipeline.Workspace)/s/portal_cliente_supertest_backend"
              
              echo "=================================================="
              echo "         INTEGRATION TESTS - SUPERTEST"
              echo "=================================================="
              echo
              echo "Ambiente:"
              echo "  Produção"
              echo
              echo "Repositório:"
              echo "  portal_cliente_supertest_backend"
              echo
              echo "Branch dos testes:"
              echo "  master"
              echo
              echo "Diretório:"
              echo "  $TEST_DIRECTORY"
              echo
              echo "Build:"
              echo "  $(Build.BuildId)"
              echo
              echo "=================================================="
              
              echo
              echo "Conteúdo do diretório:"
              echo
              
              ls -la "$TEST_DIRECTORY"

            displayName: "Exibir informações dos testes"


          # ----------------------------------------------------
          # BUILD DA IMAGEM
          # ----------------------------------------------------

          - bash: |
              set -euo pipefail
              
              TEST_DIRECTORY="$(Pipeline.Workspace)/s/portal_cliente_supertest_backend"
              
              IMAGE_NAME="portal-cliente-supertest-backend:$(Build.BuildId)"
              
              echo "=================================================="
              echo "          BUILD - SUPERTEST BACKEND"
              echo "=================================================="
              echo
              echo "Diretório:"
              echo "  $TEST_DIRECTORY"
              echo
              echo "Imagem:"
              echo "  $IMAGE_NAME"
              echo
              echo "=================================================="
              
              cd "$TEST_DIRECTORY"
              
              docker build \
                --tag "$IMAGE_NAME" \
                .
              
              echo
              echo "Imagem criada com sucesso."

            displayName: "Build Docker image"


          # ----------------------------------------------------
          # EXECUÇÃO DOS TESTES
          # ----------------------------------------------------

          - bash: |
              set -euo pipefail
              
              IMAGE_NAME="portal-cliente-supertest-backend:$(Build.BuildId)"
              
              echo "=================================================="
              echo "       EXECUTANDO TESTES DE INTEGRAÇÃO"
              echo "=================================================="
              echo
              echo "Ambiente:"
              echo "  $(INTEGRATION_TEST_NODE_ENV)"
              echo
              echo "Imagem:"
              echo "  $IMAGE_NAME"
              echo
              echo "=================================================="
              
              docker run --rm \
                -e NODE_ENV \
                -e BASE_URL \
                -e AUTH_TOKEN \
                -e AUTH_TOKEN_GENERATE \
                -e AUTH_JWT_SECRET \
                -e AUTH_MASTER_USER \
                -e AUTH_EMAIL_USER \
                -e AUTH_INTERNAL_USER \
                -e AUTH_ADDITIONAL_USER \
                -e AUTH_TOKEN_TTL_HOURS \
                -e CUSTOMER_CODE \
                -e USER_EMAIL \
                -e ADMIN_PRODUCT_ID \
                -e PERIOD_ID \
                -e ENABLE_MUTATION_TESTS \
                "$IMAGE_NAME"

            displayName: "Executar testes de integração - PRD"

            # --------------------------------------------------
            # Mantemos os testes não bloqueantes do modelo original.
            # Falhas ficam visíveis como SucceededWithIssues para
            # avaliação do responsável e eventual rollback manual.
            # --------------------------------------------------

            continueOnError: true

            env:

              NODE_ENV: $(INTEGRATION_TEST_NODE_ENV)

              BASE_URL: $(BASE_URL)

              AUTH_TOKEN: $(AUTH_TOKEN)

              AUTH_TOKEN_GENERATE: true

              AUTH_JWT_SECRET: $(AUTH_JWT_SECRET)

              AUTH_MASTER_USER: $(CUSTOMER_CODE)

              AUTH_EMAIL_USER: $(USER_EMAIL)

              AUTH_INTERNAL_USER: $(AUTH_INTERNAL_USER)

              AUTH_ADDITIONAL_USER: $(AUTH_ADDITIONAL_USER)

              AUTH_TOKEN_TTL_HOURS: 6

              CUSTOMER_CODE: $(CUSTOMER_CODE)

              USER_EMAIL: $(USER_EMAIL)

              ADMIN_PRODUCT_ID: $(ADMIN_PRODUCT_ID)

              PERIOD_ID: $(PERIOD_ID)

              ENABLE_MUTATION_TESTS: false


          # ----------------------------------------------------
          # LIMPEZA
          # ----------------------------------------------------

          - bash: |
              set +e
              
              IMAGE_NAME="portal-cliente-supertest-backend:$(Build.BuildId)"
              
              echo "=================================================="
              echo "              LIMPEZA DO TESTE"
              echo "=================================================="
              echo
              echo "Removendo imagem:"
              echo "  $IMAGE_NAME"
              echo
              
              docker image rm \
                "$IMAGE_NAME" \
                || true
              
              echo
              echo "Limpeza concluída."
              echo
              echo "=================================================="
              
              exit 0

            displayName: "Remover imagem temporária"

            condition: always()

  # ============================================================
  # 7. ROLLBACK BACKEND - PRODUÇÃO
  # ============================================================

  - stage: Rollback_Backend_Prod

    displayName: "7. Rollback Backend - Produção"

    trigger: manual

    # ----------------------------------------------------------
    # Rollback de produção é um stage manual/opcional.
    #
    # Stages com trigger manual não aceitam dependsOn no Azure
    # DevOps. Por isso, este stage fica fora do caminho
    # automático e deve ser acionado manualmente somente quando
    # houver necessidade operacional de rollback.
    # ----------------------------------------------------------

    jobs:


      # ========================================================
      # ROLLBACK PRODUÇÃO
      # ========================================================

      - job: RollbackBackendProd

        displayName: "Rollback Backend - Produção"

        steps:

          - checkout: none


          - bash: |
              set -euo pipefail
              
              echo "=================================================="
              echo "           ROLLBACK BACKEND - PRODUÇÃO"
              echo "=================================================="
              echo
              echo "Ambiente:"
              echo "  PRODUÇÃO"
              echo
              echo "Acionamento:"
              echo "  MANUAL"
              echo
              echo "Status:"
              echo "  SIMULAÇÃO"
              echo
              echo "Este é apenas o placeholder do rollback."
              echo
              echo "O processo real de rollback em produção"
              echo "será implementado posteriormente pela equipe."
              echo
              echo "Nenhuma aplicação está sendo alterada"
              echo "neste momento."
              echo
              echo "Resultado:"
              echo "  OK"
              echo
              echo "=================================================="
              
              true

            displayName: "Executar rollback em produção"
